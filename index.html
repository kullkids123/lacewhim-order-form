<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lacewhim ♡ order form</title><link href="https://fonts.googleapis.com/css2?family=Allison&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--pink:#c9859b;--ink:#6b505b;--paper:#fffafc;--line:#eed8e0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#fff6fa,#f9edf3 65%,#fffafc);color:var(--ink);font-family:'Comic Neue',sans-serif;min-height:100vh}.wrap{max-width:790px;margin:auto;padding:24px 16px 75px}header{text-align:center;padding:15px 0 8px}h1{font:normal 76px/1 'Allison',cursive;color:#b97891;margin:8px}header p{margin:0 0 26px}.panel{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:24px;padding:25px;box-shadow:0 12px 35px #a9718812}h2{font:600 24px 'Fredoka';color:#b46f89;margin:5px 0 8px}h3{font:500 19px 'Fredoka';color:#b46f89}.hint{font-size:14px;line-height:1.5;color:#907985}.steps{display:flex;justify-content:center;gap:7px;margin:0 0 20px}.dot{width:30px;height:7px;border-radius:30px;background:#ebdce2}.dot.active{background:#c9859b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{display:block;text-align:center;border:1px solid var(--line);background:#fffafd;border-radius:18px;padding:23px 9px;cursor:pointer}.choice:has(input:checked){border:2px solid var(--pink);background:#fff0f5}.choice input{display:block;margin:0 auto 10px;accent-color:var(--pink)}label.field{display:block;margin:17px 0 8px;font-weight:bold}input:not([type=checkbox]):not([type=file]),select,textarea{display:block;width:100%;border:1px solid #e6cbd6;border-radius:12px;background:#fff;padding:12px;color:#644d58;font:16px 'Comic Neue'}textarea{min-height:75px;resize:vertical}input[type=file]{width:100%;margin:9px 0;font-size:14px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.btn{border:0;border-radius:50px;background:#c9859b;color:white;padding:12px 22px;font:500 16px 'Fredoka';cursor:pointer}.btn.secondary{background:#f4e4eb;color:#956a7b}.btn:disabled{opacity:.5;cursor:not-allowed}.item{border:1px solid var(--line);padding:18px;border-radius:18px;margin:15px 0;background:#fffdfd}.itemhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:13px}.link{color:#ad6e87}.error{color:#b83457;font-size:14px;margin-top:12px}.summary{white-space:pre-wrap;line-height:1.7;background:#fff7fa;padding:16px;border-radius:16px;border:1px solid var(--line)}.tag{background:#f9e8ef;padding:5px 12px;border-radius:25px;display:inline-block;margin:4px}.notice{border-left:3px solid #cf9aaf;background:#fff4f8;padding:12px 14px;border-radius:6px;font-size:14px;margin-top:18px}.hide{display:none!important}footer{text-align:center;margin:24px;font-size:13px;color:#a08491}@media(max-width:540px){h1{font-size:65px}.panel{padding:19px}.grid{grid-template-columns:1fr}.choice{padding:14px}.nav .btn{padding:11px 15px;font-size:14px}}</style>
<style>
/* lacewhim tidy mobile-first refinement */
:root{--pink:#bd8197;--ink:#634c56;--line:#ecdce2}
body{background:linear-gradient(180deg,#fff9fc 0%,#f8edf2 100%);line-height:1.55}
.wrap{max-width:700px;padding:16px 16px 60px}
header{padding:12px 0 10px}
header h1{font-size:76px;margin:0;color:#b77991}
header p{font-size:13px;letter-spacing:.06em;color:#9a7b89;margin:0 0 22px}
.panel{padding:30px;border-radius:22px;background:#fffdfef5;box-shadow:0 12px 35px #aa7a8b10}
h2{font-size:24px;line-height:1.3;margin:0 0 8px}
h3{font-size:17px;line-height:1.3;margin:0}
.hint{margin:8px 0 20px;font-size:13px;line-height:1.65}
.steps{gap:6px;margin-bottom:18px}.dot{height:5px;max-width:48px;flex:1}
.grid{gap:12px;margin:22px 0 10px}
.choice{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;min-height:140px;padding:18px 12px;font-family:'Fredoka',sans-serif;font-weight:400;font-size:15px;transition:.15s}
.choice input{margin:0 0 4px;width:18px;height:18px}
.choice:has(input:checked){border:1.5px solid #bd8197;box-shadow:0 0 0 3px #f8e6ed}
.item{padding:23px;margin:18px 0 22px;border-radius:17px;background:#fffafb}
.itemhead{border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:20px}
label.field{font-size:13px;letter-spacing:.015em;margin:20px 0 7px;color:#775b68}
input:not([type=checkbox]):not([type=file]),select,textarea{padding:13px 14px;border-radius:10px;border:1px solid #e9d6de;font:15px 'Comic Neue',sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:#bf8ba0;box-shadow:0 0 0 3px #f9edf1}
textarea{min-height:92px}
input[type=file]{background:#fff;border:1px dashed #dcbac8;border-radius:12px;padding:14px}
.nav{border-top:1px solid #f2e7eb;padding-top:20px;margin-top:28px}
.btn{padding:12px 19px;font-size:14px}
.btn.secondary{background:#f5e8ed}
.summary{background:#fff8fb;border-radius:14px;font-size:14px;line-height:1.9;overflow-wrap:anywhere}
.notice{line-height:1.65}
footer{margin-top:24px}
@media(max-width:540px){
.wrap{padding:12px 13px 45px}
header h1{font-size:68px}
.panel{padding:22px 17px;border-radius:19px}
h2{font-size:22px}
.grid{grid-template-columns:1fr;gap:10px}
.choice{min-height:78px;flex-direction:row;justify-content:flex-start;text-align:left;gap:15px;padding:13px 17px}
.choice input{margin:0}
.choice div{font-size:25px!important}
.item{padding:16px 14px}
.itemhead{align-items:flex-start}
.nav .btn{font-size:13px;padding:11px 14px}
}
</style>
</head><body><div class="wrap"><header><h1>lacewhim</h1><p>♡ a little order form, made with love ♡</p></header><div class="steps" id="dots"></div><main class="panel" id="screen"></main><footer>handmade with a little whimsy ♡ &nbsp; · &nbsp; <a class="link" href="https://kullkids123.github.io/lacewhim-gallery/" target="_blank" rel="noopener">view our gallery</a></footer></div><script>
// Replace this with your deployed Google Apps Script Web App URL when ready.
const ENDPOINT = '';
// Current lacewhim estimated ranges. Bouquet pricing is TBA.
const PRICES={simple:[10,16],detailed:[18,25],ownBinder:[20,35],ourBinder:[25,40],sleeves:[8,12]};
const LABELS={toploader:'Toploader Deco',binder:'Binder Deco',bouquet:'Custom K-pop Bouquet'};
const ORDER_CODE='Assigned after submission';
let selected=[],current=0,stage=0;const order={name:'',telegram:'',notes:'',items:[]};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function steps(){return ['Choose items',...selected.map(x=>LABELS[x]),'Your details','Review'];}
function draw(){const s=steps();$('dots').innerHTML=s.map((_,i)=>`<span class="dot ${i===stage?'active':''}" title="${esc(s[i])}"></span>`).join('');if(stage===0)choose();else if(stage<=selected.length)product(selected[stage-1]);else if(stage===selected.length+1)details();else review();window.scrollTo({top:0,behavior:'smooth'});}
function nav(back=true,next='Continue ♡'){return `<div class="nav">${back?'<button class="btn secondary" onclick="prev()">← Back</button>':'<span></span>'}<button class="btn" onclick="next()">${next} →</button></div><div id="err" class="error" role="alert"></div>`}
function choose(){$('screen').innerHTML=`<h2>choose your little creations ♡</h2><p class="hint">select one or more items — we'll only show the pages you need.</p><div class="grid">${Object.keys(LABELS).map((k,i)=>`<label class="choice"><input type="checkbox" value="${k}" ${selected.includes(k)?'checked':''}><div style="font-size:29px">${['🎀','🪽','💐'][i]}</div>${LABELS[k]}</label>`).join('')}</div>${nav(false)}`}
function itemDefault(type){return {type,style:'',size:'A5',provided:'yes',code:'',aesthetic:'',aestheticCode:'',colour:'',wrapper:'',flower:'',pcQty:1,sleeves:'no',quantity:1,follow:'inspired',notes:'',files:[]}}
function ensure(type){if(!order.items.some(x=>x.type===type))order.items.push(itemDefault(type))}
function product(type){ensure(type);const arr=order.items.filter(x=>x.type===type);$('screen').innerHTML=`<h2>${LABELS[type]} ♡</h2><p class="hint">choose your details below. design codes are optional; personal references are welcome. <a class="link" target="_blank" rel="noopener" href="https://kullkids123.github.io/lacewhim-gallery/">open gallery ↗</a></p><div id="items">${arr.map((it,i)=>card(it,i)).join('')}</div><button class="btn secondary" onclick="addItem('${type}')">+ Add another ${LABELS[type]}</button>${nav()}`;}
function field(id,label,val='',placeholder=''){return `<label class="field" for="${id}">${label}</label><input id="${id}" value="${esc(val)}" placeholder="${esc(placeholder)}">`}
function sel(id,label,options,value){return `<label class="field" for="${id}">${label}</label><select id="${id}">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select>`}
function card(it,i){const id=`p${i}`,type=it.type;let body=field(`${id}-code`,'Gallery design code (optional)',it.code,type==='toploader'?'TL-M001 / TL-D001': 'BD-001');if(type==='toploader')body=sel(`${id}-style`,'Toploader style',[['minimalist','Minimalist'],['detailed','Detailed']],it.style)+body; if(type==='binder')body=sel(`${id}-size`,'Binder size',[['A5','A5'],['A6','A6'],['other','Other / please specify in notes']],it.size)+sel(`${id}-provided`,'Binder supplied by lacewhim?',[['yes','Yes, please provide the binder'],['no','No, I will send my own binder']],it.provided)+sel(`${id}-sleeves`,'Add sleeves?',[['no','No'],['yes','Yes (+RM8–12)']],it.sleeves)+`<p class="hint">If you send your own binder, shipping both ways is at your expense.</p>`+body;if(type==='bouquet')body=field(`${id}-wrapper`,'Wrapper code (required, WR-...)',it.wrapper,'WR-001')+field(`${id}-flower`,'Flower code (required, FL-...)',it.flower,'FL-001')+field(`${id}-pcQty`,'Number of photocards (required)',it.pcQty);else body+=sel(`${id}-follow`,'How closely should we follow the reference?',[['inspired','Inspired by reference'],['close','Follow reference closely (where possible)']],it.follow)+field(`${id}-aesthetic`,'Aesthetic preference',it.aesthetic,'Angelcore / Coquette / Vintage / Gothic Romance')+field(`${id}-aestheticCode`,'Aesthetic gallery code (optional)',it.aestheticCode,'AN-001');body+=(type==='bouquet'?'':field(`${id}-colour`,'Colour theme',it.colour,'Pink & ivory'))+field(`${id}-quantity`,'Quantity (required, same design)',it.quantity)+`<label class="field" for="${id}-notes">Additional requests / design details</label><textarea id="${id}-notes">${esc(it.notes)}</textarea><label class="field" for="${id}-files">Upload inspiration photos (optional, max 3 per item, 2 MB each)</label><input id="${id}-files" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="hint" id="${id}-filenames">${it.files.length?it.files.map(f=>esc(f.name)).join(', '):'No images selected'}</div>`;return `<div class="item"><div class="itemhead"><h3>${LABELS[type]} #${i+1}</h3>${order.items.filter(x=>x.type===type).length>1?`<button class="btn secondary small" onclick="removeItem('${type}',${i})">Remove</button>`:''}</div>${body}</div>`}
function readFields(){if(stage===0){selected=[...document.querySelectorAll('.choice input:checked')].map(x=>x.value);if(!selected.length)return fail('Please choose at least one item ♡');order.items=order.items.filter(x=>selected.includes(x.type));selected.forEach(ensure);return true}if(stage<=selected.length){const type=selected[stage-1];const items=order.items.filter(x=>x.type===type);for(let i=0;i<items.length;i++){const it=items[i],p=`p${i}-`;const names=type==='toploader'?['style','code','follow','aesthetic','aestheticCode','colour','quantity','notes']:type==='binder'?['size','provided','sleeves','code','follow','aesthetic','aestheticCode','colour','quantity','notes']:['wrapper','flower','pcQty','quantity','notes'];names.forEach(n=>it[n]=$(p+n).value.trim());if(!Number.isInteger(Number(it.quantity))||Number(it.quantity)<1||Number(it.quantity)>20)return fail('Quantity must be between 1 and 20.');if(type==='bouquet'){if(!/^WR-[A-Za-z0-9-]+$/i.test(it.wrapper)||!/^FL-[A-Za-z0-9-]+$/i.test(it.flower))return fail('Please enter both Wrapper Code (WR-...) and Flower Code (FL-...) from the gallery.');if(!it.pcQty||!Number.isInteger(Number(it.pcQty))||Number(it.pcQty)<1||Number(it.pcQty)>30)return fail('Please enter the number of photocards (1–30).');}const files=[...$(p+'files').files];if(files.length>3)return fail('Maximum 3 images per item.');for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>2*1024*1024)return fail('Images must be JPG, PNG or WEBP, max 2 MB each.')}if(files.length)it.files=files;}return true}if(stage===selected.length+1){order.name=$('name').value.trim();order.telegram=$('telegram').value.trim();order.notes=$('notes').value.trim();if(!order.name||!/^@?[A-Za-z0-9_]{5,32}$/.test(order.telegram))return fail('Please enter your name and a valid Telegram username (at least 5 characters).');return true}return true}
function fail(t){$('err').textContent=t;return false}function next(){if(!readFields())return;stage++;draw()}function prev(){readFields();stage=Math.max(0,stage-1);draw()}function addItem(type){readFields();order.items.push(itemDefault(type));draw()}function removeItem(type,i){readFields();const arr=order.items.filter(x=>x.type===type);order.items.splice(order.items.indexOf(arr[i]),1);draw()}
function details(){$('screen').innerHTML=`<h2>your little details ♡</h2><p class="hint">we'll contact you on Telegram with your final quotation. shipping details will be requested privately once your order is ready.</p>${field('name','Name / nickname *',order.name,'Your name')}${field('telegram','Telegram username *',order.telegram,'@username')}<label class="field" for="notes">Anything else you'd like us to know?</label><textarea id="notes">${esc(order.notes)}</textarea>${nav()}`}
function estimate(){let low=0,high=0,hasBouquet=false;const lines=[];order.items.forEach(it=>{let range=null;let label=LABELS[it.type];if(it.type==='toploader'){range=it.style==='detailed'?PRICES.detailed:PRICES.simple;label+=' ('+(it.style==='detailed'?'Detailed':'Simple')+')'}else if(it.type==='binder'){range=it.provided==='no'?PRICES.ownBinder:PRICES.ourBinder;label+=it.provided==='no'?' (Your own binder)':' (Binder by us)'}else hasBouquet=true;if(range){let a=range[0],b=range[1];if(it.type==='binder'&&it.sleeves==='yes'){a+=PRICES.sleeves[0];b+=PRICES.sleeves[1];label+=' + sleeves'}low+=a*Number(it.quantity);high+=b*Number(it.quantity);lines.push(`${label} × ${it.quantity}: RM${a*Number(it.quantity)}–RM${b*Number(it.quantity)}`)}else lines.push(`${label} × ${it.quantity}: Price TBA`)});return {low,high,hasBouquet,lines}}
function clean(){return order.items.map(({files,...rest})=>({...rest,files:files.map(f=>({name:f.name,type:f.type,size:f.size}))}))}
function review(){const e=estimate();let out=`<h2>review your order ♡</h2><p class="hint">please check your choices before sending your request.</p><div class="summary"><b>Order Code: Assigned after submission</b><br><span class="small">Your sequential order code will appear once your request is successfully saved.</span>

<b>${esc(order.name)}</b> · ${esc(order.telegram)}\n\n${order.items.map((it,i)=>`${i+1}. ${LABELS[it.type]} × ${it.quantity}\n${it.type==='bouquet'?`Wrapper: ${it.wrapper||'Not specified'} | Flower: ${it.flower||'Not specified'}\nPhotocards: ${it.pcQty}`:`Code: ${it.code||'Personal inspiration'} | ${it.type==='binder'?`Size: ${it.size} | Binder by us: ${it.provided} | Add sleeves: ${it.sleeves}`:`Style: ${it.style}`}`}\n${it.type==='bouquet'?'':`Colour: ${it.colour||'Not specified'} | `}Inspiration photos: ${it.files.length}`).join('\n\n')}\n\n${e.lines.join('\n')}\n\nEstimated total: RM${e.low}–RM${e.high}${e.hasBouquet?' + bouquet price (TBA)':''}</div><div class="notice"><b>Price estimate only ♡</b><br>These are estimated price ranges, not a final quote. Bouquet pricing is still to be confirmed. Your final price depends on design complexity and materials. We will contact you on Telegram before any payment. Submitting does not confirm a paid order.</div><label class="field"><input type="checkbox" id="agree"> I understand that the final quotation may differ.</label><div class="nav"><button class="btn secondary" onclick="prev()">← Back</button><button class="btn" id="submit" onclick="submitOrder()">Submit Order Request ♡</button></div><div id="err" class="error" role="alert"></div>`;if(!ENDPOINT)out+=`<p class="notice"><b>Preview mode:</b> Submissions are not active yet. The Google Apps Script connection must be set up first. You can still preview the entire form.</p>`;$('screen').innerHTML=out;$('submit').disabled=!ENDPOINT;}
async function copyOrderCode(){const code=$('confirmedCode')?.textContent||'';try{await navigator.clipboard.writeText(code);$('copyFeedback').textContent='Copied! ♡'}catch(e){const el=document.createElement('textarea');el.value=code;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();$('copyFeedback').textContent='Copied! ♡'}}
function toBase64(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(f)})}
async function submitOrder(){if(!$('agree').checked)return fail('Please tick the acknowledgement first ♡');const btn=$('submit');btn.disabled=true;btn.textContent='Sending…';try{const items=[];for(const it of order.items){const {files,...rest}=it;items.push({...rest,images:await Promise.all(files.map(async f=>({name:f.name,mimeType:f.type,base64:await toBase64(f)})))})}const payload={name:order.name,telegram:order.telegram,notes:order.notes,estimatedPrice:`RM${estimate().low}–RM${estimate().high}${estimate().hasBouquet?' + bouquet TBA':''}`,items};const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const result=await res.json();if(!result.success)throw Error(result.error||'Could not save order');$('screen').innerHTML=`<h2>thank you, lovely! ♡</h2><p>Your request has been received.</p><p class="tag" id="confirmedCode">${esc(result.orderId)}</p><p><button class="btn secondary" onclick="copyOrderCode()">Copy Order Code ♡</button></p><p id="copyFeedback" class="hint"></p><p class="hint">Please save your order ID. We'll contact you on Telegram with your quotation before payment.</p>`;$('dots').innerHTML='';}catch(err){fail('Could not submit. Please try again or contact @naathewhimsical.');btn.disabled=false;btn.textContent='Submit Order Request ♡'}}

draw();
</script></body></html>
