<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lacewhim ♡ order form</title>
<link href="https://fonts.googleapis.com/css2?family=Allison&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#c7859e;--dark:#735e68;--line:#eadde3;--bg:#fff8fb}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#fffafd,#f8eaf1);color:var(--dark);font-family:'Comic Neue',cursive;font-size:17px}
main{max-width:690px;margin:auto;padding:30px 22px 60px}
header{text-align:center;padding:30px 0 42px}
.logo{font:85px Allison,cursive;color:#b97f98;line-height:1}
.subtitle{letter-spacing:2px;margin-top:12px}
.progress{display:flex;gap:10px;justify-content:center;margin:35px 0}
.progress span{width:88px;height:9px;border-radius:20px;background:#eadde3}
.progress span.active{background:var(--pink)}
.card{background:#fffdfef0;border:1px solid var(--line);border-radius:34px;padding:32px;box-shadow:0 10px 30px #c7859e10}
h1,h2,h3{font-family:Fredoka,sans-serif;color:#b47a93}
h1{font-size:34px;margin:0 0 22px}
h2{font-size:25px}
p{line-height:1.8}
.choice{display:flex;align-items:center;gap:24px;padding:28px;margin:18px 0;border:1px solid var(--line);border-radius:30px;background:#fffafd;cursor:pointer;font:23px Fredoka,sans-serif}
.choice input{width:25px;height:25px;accent-color:var(--pink)}
.choice .emoji{font-size:35px}
label.field{display:block;margin:22px 0 8px;font-weight:bold}
input[type=text],input[type=number],textarea,select{width:100%;padding:15px;border:1px solid #e7d5df;border-radius:16px;background:#fffafd;color:var(--dark);font:17px 'Comic Neue',cursive}
textarea{min-height:95px;resize:vertical}
input[type=file]{width:100%;margin:10px 0}
button{border:0;border-radius:28px;background:var(--pink);color:white;padding:16px 25px;font:18px Fredoka,sans-serif;cursor:pointer}
button.secondary{background:#f2e5eb;color:#9c6a80}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:35px;border-top:1px solid var(--line);padding-top:28px}
.actions button:last-child{margin-left:auto}
.note{font-size:14px;color:#987c8b}
.item{border:1px solid var(--line);border-radius:23px;padding:20px;margin:18px 0;background:#fffafd}
.item h3{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.hidden{display:none!important}
.summary{background:#fff6fa;border-radius:20px;padding:20px;margin:16px 0;white-space:pre-wrap;line-height:1.8}
footer{text-align:center;padding:38px 0;color:#ae8296}
a{color:#b47a93}
.error{color:#c34f73;font-weight:bold}
.success{text-align:center}
@media(max-width:450px){main{padding:18px 14px}.card{padding:25px 22px}.logo{font-size:76px}.choice{font-size:20px;padding:22px 18px}}
</style>
</head>
<body>
<main>
<header>
<div class="logo">lacewhim</div>
<div class="subtitle">♡ a little order form, made with love ♡</div>
</header>
<div class="progress"><span id="p1" class="active"></span><span id="p2"></span><span id="p3"></span></div>

<section class="card" id="page
